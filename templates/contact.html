{% extends "base.html" %}

{% block title %}Contact - FPDS{% endblock %}

{% block content %}
    <section style="padding: 60px 0;">
        <div class="text-center mb-5">
            <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 15px;">
                Get In <span style="color: var(--neon-green);">Touch</span>
            </h1>
            <p style="color: var(--text-gray); font-size: 1.1rem;">Have questions? We'd love to hear from you!</p>
        </div>
    </section>

    <div class="contact-section">
        <!-- Left: Contact Info -->
        <div class="contact-info">
            <div class="contact-item">
                <i class="bi bi-envelope"></i>
                <div>
                    <h4 style="margin-bottom: 5px;">Email</h4>
                    <p style="color: var(--text-gray); margin: 0;">support@fpds.ai</p>
                </div>
            </div>
            <div class="contact-item">
                <i class="bi bi-telephone"></i>
                <div>
                    <h4 style="margin-bottom: 5px;">Phone</h4>
                    <p style="color: var(--text-gray); margin: 0;">+91 98765 43210</p>
                </div>
            </div>
            <div class="contact-item">
                <i class="bi bi-geo-alt"></i>
                <div>
                    <h4 style="margin-bottom: 5px;">Location</h4>
                    <p style="color: var(--text-gray); margin: 0;">Bengaluru, India</p>
                </div>
            </div>
        </div>

        <!-- Right: Contact Form -->
        <div class="contact-form-card">
            <h3 style="margin-bottom: 25px; font-size: 1.5rem;">Send Us a Message</h3>
            <form class="cyber-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="What's this about?" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-send"></i> Send Message
                </button>
            </form>
        </div>
    </div>
{% endblock %}
