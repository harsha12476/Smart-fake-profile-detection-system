{% extends "base.html" %}

{% block title %}Admin Login - FPDS{% endblock %}

{% block content %}
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="bi bi-shield-lock" style="font-size: 4rem; color: var(--neon-green); text-shadow: 0 0 30px rgba(57, 255, 20, 0.5);"></i>
            </div>
            <h1 style="text-align: center;">Admin Access</h1>
            <p class="subtitle" style="text-align: center;">Secure administrator authentication</p>
            <p style="text-align: center; color: var(--alert-red); font-size: 0.85rem; margin-bottom: 25px; font-weight: 600;">
                <i class="bi bi-exclamation-triangle"></i> Authorized Personnel Only
            </p>
            
            <form class="cyber-form" method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-shield-check"></i> Login
                </button>
            </form>
            
            <div class="auth-links">
                <p><a href="{{ url_for('index') }}" style="color: var(--text-gray);"><i class="bi bi-arrow-left"></i> Back to Home</a></p>
            </div>
        </div>
    </div>
{% endblock %}
