{% extends "admin_base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
    <div class="card border-0 shadow-lg">
        <div class="card-header bg-primary text-white py-4">
            <h4 class="fw-bold mb-0">
                <i class="bi bi-pencil"></i> Edit User
            </h4>
        </div>
        <div class="card-body p-5">
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" disabled>
                    <small class="text-muted">Email cannot be changed</small>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">New Password (leave blank to keep current)</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>
                <div class="mb-4">
                    <label for="status" class="form-label fw-bold">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="Active" {% if user.get('status') == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Blocked" {% if user.get('status') == 'Blocked' %}selected{% endif %}>Blocked</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-check-circle"></i> Save Changes
                    </button>
                    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary flex-fill">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
